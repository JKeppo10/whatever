spring:
  application:
    name: spincycle
  profiles:
    active: ${SPRING_PROFILES_ACTIVE:dev}
  autoconfigure:
    # Until A2 adds the real user lookup, this would create a demo user and log its password (NFR07).
    exclude: org.springframework.boot.security.autoconfigure.UserDetailsServiceAutoConfiguration

server:
  port: ${SERVER_PORT:8080}
  servlet:
    session:
      cookie:
        http-only: true
        same-site: lax

management:
  endpoints:
    web:
      exposure:
        include: health

spincycle:
  cors:
    # Comma-separated. Default is the Vite dev server.
    allowed-origins: ${CORS_ALLOWED_ORIGINS:http://localhost:5173}
